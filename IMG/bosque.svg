<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="El Bosque de Cables">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050a1c"/><stop offset="1" stop-color="#1b2a63"/>
    </linearGradient>
    <filter id="brillo"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#cielo)"/>
  <circle cx="650" cy="90" r="42" fill="#E0E1DD" opacity=".9"/>
  <g fill="#fff" opacity=".8"><circle cx="80" cy="60" r="2"/><circle cx="220" cy="30" r="2"/><circle cx="400" cy="70" r="1.5"/><circle cx="520" cy="35" r="2"/><circle cx="740" cy="190" r="2"/></g>
  <!-- cables entre árboles -->
  <g fill="none" stroke="#00E5FF" stroke-width="3" filter="url(#brillo)" opacity=".85">
    <path d="M110 150Q250 230 390 140T690 150"/>
    <path d="M110 200Q250 280 390 190T690 200" stroke="#7B2CBF"/>
  </g>
  <!-- árboles -->
  <g>
    <g transform="translate(110 0)"><rect x="-14" y="150" width="28" height="270" fill="#13204d"/><circle cx="0" cy="130" r="55" fill="#0f3a5c" stroke="#00E5FF" stroke-width="3"/><circle cx="-18" cy="120" r="7" fill="#FFB703" filter="url(#brillo)"/><circle cx="20" cy="140" r="7" fill="#00E5FF" filter="url(#brillo)"/></g>
    <g transform="translate(390 0)"><rect x="-16" y="140" width="32" height="280" fill="#13204d"/><circle cx="0" cy="120" r="62" fill="#14396b" stroke="#00E5FF" stroke-width="3"/><circle cx="-20" cy="110" r="8" fill="#00E5FF" filter="url(#brillo)"/><circle cx="24" cy="130" r="8" fill="#FFB703" filter="url(#brillo)"/></g>
    <g transform="translate(690 0)"><rect x="-14" y="150" width="28" height="270" fill="#13204d"/><circle cx="0" cy="130" r="55" fill="#0f3a5c" stroke="#00E5FF" stroke-width="3"/><circle cx="-16" cy="125" r="7" fill="#FFB703" filter="url(#brillo)"/><circle cx="18" cy="142" r="7" fill="#00E5FF" filter="url(#brillo)"/></g>
  </g>
  <!-- suelo y camino -->
  <rect y="410" width="800" height="90" fill="#0a1233"/>
  <path d="M300 500Q380 450 420 410L440 410Q460 450 560 500z" fill="#1c2a5c"/>
  <path d="M0 440h800" stroke="#00E5FF" stroke-width="2" opacity=".5" filter="url(#brillo)"/>
  <!-- mapa holográfico -->
  <g filter="url(#brillo)" transform="translate(330 420)">
    <ellipse cx="70" cy="30" rx="60" ry="14" fill="none" stroke="#00E5FF" stroke-width="3"/>
    <path d="M20 22l25-12 30 10 25-10v28l-25 10-30-10-25 12z" fill="#00E5FF" opacity=".35" stroke="#00E5FF" stroke-width="2"/>
  </g>
</svg>
