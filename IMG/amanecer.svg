<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Amanecer sobre la ciudad de Aldrath">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a6d"/><stop offset=".55" stop-color="#d9693f"/><stop offset="1" stop-color="#FFB703"/>
    </linearGradient>
    <filter id="brillo"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="500" fill="url(#cielo)"/>
  <g fill="#fff" opacity=".7"><circle cx="90" cy="50" r="2"/><circle cx="260" cy="90" r="1.5"/><circle cx="700" cy="60" r="2"/></g>
  <!-- sol -->
  <circle cx="400" cy="340" r="95" fill="#FFE29A" filter="url(#brillo)"/>
  <!-- ciudad -->
  <g fill="#16224f" stroke="#00E5FF" stroke-width="2">
    <rect x="60" y="300" width="70" height="200"/><rect x="140" y="250" width="60" height="250"/>
    <rect x="210" y="320" width="80" height="180"/><rect x="520" y="290" width="70" height="210"/>
    <rect x="600" y="230" width="60" height="270"/><rect x="670" y="310" width="90" height="190"/>
  </g>
  <!-- torre circuito -->
  <path d="M360 500V300l20-30h40l20 30v200z" fill="#16224f" stroke="#00E5FF" stroke-width="3"/>
  <circle cx="400" cy="262" r="12" fill="#FFB703" filter="url(#brillo)"/>
  <!-- ventanas encendidas -->
  <g fill="#FFB703"><rect x="80" y="330" width="10" height="10"/><rect x="100" y="360" width="10" height="10"/><rect x="155" y="290" width="10" height="10"/><rect x="170" y="330" width="10" height="10"/><rect x="620" y="270" width="10" height="10"/><rect x="535" y="330" width="10" height="10"/><rect x="690" y="350" width="10" height="10"/></g>
  <!-- siluetas de Milech y Luna -->
  <g fill="#0B132B">
    <circle cx="300" cy="448" r="12"/><rect x="288" y="460" width="24" height="40" rx="8"/>
    <rect x="250" y="475" width="32" height="14" rx="7"/><circle cx="246" cy="478" r="8"/>
  </g>
</svg>
